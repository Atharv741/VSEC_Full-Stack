```html
<!DOCTYPE html>
<html>
<head>
    <title>Random Background Generator</title>

    <style>
        body {
            text-align: center;
            font-family: Arial;
            padding-top: 100px;
        }

        button {
            padding: 15px 25px;
            font-size: 18px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🌈 Random Background Generator</h1>

    <p>Click the button to change the background!</p>

    <button onclick="changeColor()">Change Color</button>

    <script>

        function changeColor() {

            var colors = ["red", "blue", "green", "yellow", "pink", "purple", "orange"];

            var random = Math.floor(Math.random() * colors.length);

            document.body.style.backgroundColor = colors[random];
        }

    </script>

</body>
</html>
