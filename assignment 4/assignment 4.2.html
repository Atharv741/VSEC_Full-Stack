
<!DOCTYPE html>
<html>
<head>
    <title>Catch Me</title>

    <style>
        #btn {
            position: absolute;
            top: 200px;
            left: 300px;
        }
    </style>
</head>

<body>

    <button id="btn" onmouseover="move()">Catch Me</button>

    <script>
        function move() {
            let x = Math.random() * 500;
            let y = Math.random() * 300;

            document.getElementById("btn").style.left = x + "px";
            document.getElementById("btn").style.top = y + "px";
        }
    </script>

</body>
</html>
